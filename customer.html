<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17364a"><title>VYOM · Order Online</title><style>
:root{--navy:#17364a;--cream:#fbf4e7;--paper:#fffdf8;--rust:#c65b3d;--gold:#dba34c;--ink:#213747;--muted:#71808a;--line:#eadfce}*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.hero{background:var(--navy);color:white;text-align:center;padding:26px 16px 22px}.hero h1{letter-spacing:5px;margin:0;font-size:30px}.hero p{margin:5px 0 0;color:#e9c18b;font-size:11px;letter-spacing:2px}.wrap{max-width:980px;margin:auto;padding:16px}.intro{background:#fffdf8;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:14px}.cats{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.cat{white-space:nowrap;border:0;border-radius:99px;padding:9px 13px;background:#eee6d9;color:#52616a;font-weight:700}.cat.active{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{background:#fffdf8;border:1px solid var(--line);border-radius:13px;padding:13px;text-align:left;min-height:94px;color:var(--ink)}.item b{display:block;font-size:14px}.item small{color:var(--muted)}.price{color:var(--rust);font-weight:850;margin-top:7px;display:block}.cart{position:sticky;bottom:0;background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px;box-shadow:0 -5px 25px #17364a12}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f0e9de}.qty{display:flex;align-items:center;gap:10px}.qty button{border:0;border-radius:8px;background:#eee6d9;padding:4px 10px;font-weight:900}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:white}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:12px 0}.cta{width:100%;border:0;border-radius:11px;background:var(--rust);color:white;font-weight:850;padding:14px;font-size:15px}.hint{font-size:11px;color:var(--muted);margin-top:8px}.empty{color:var(--muted);padding:12px 0;text-align:center}@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cart{max-width:620px;margin:18px auto}}
</style></head><body><header class="hero"><h1>VYOM</h1><p>CAFE · COSMIC CAMEL</p></header><main class="wrap"><div class="intro"><b>Good food, good company.</b><div style="color:#71808a;font-size:13px">Choose your favourites, enter your name and send your order directly to VYOM on WhatsApp.</div></div><div class="cats" id="cats"></div><div class="grid" id="items"></div><section class="cart"><b>Your order</b><div id="cart"><div class="empty">Your cart is empty. Add something delicious.</div></div><div class="field"><label for="name">Your name *</label><input id="name" placeholder="Enter your name" autocomplete="name"></div><div class="field"><label for="notes">Special instructions (optional)</label><textarea id="notes" rows="2" placeholder="Less spicy, no onion…"></textarea></div><div class="total"><span>Total</span><span id="total">₹0</span></div><button class="cta" id="send">Place order on WhatsApp</button><div class="hint">WhatsApp will open with your order. Please tap Send to submit it. Payment is at the counter.</div></section></main><script>
const MENU=[['Breakfast','Poha',110],['Breakfast','Aloo Paratha',120],['Breakfast','Gobhi Paratha',150],['Breakfast','Paneer Paratha',200],['Breakfast','Vegetable Chilla',150],['Pancake','Nutella Pancake',200],['Pancake','Honey Pancake',150],['Pancake','Banana & Honey Pancake',170],['Pancake','Porridge',160],['Hot Beverages','Chai',40],['Hot Beverages','Hand-Beaten Coffee',80],['Hot Beverages','Lemon Tea',60],['Hot Beverages','Ginger, Lemon & Honey',90],['Hot Beverages','Black Tea',40],['Hot Beverages','Black Coffee',60],['Hot Beverages','Hot Chocolate',250],['Hot Beverages','Milk With Bournvita',120],['Cold Beverages','Lemonana',180],['Cold Beverages','Banana Shake',150],['Cold Beverages','Cosmic Lassi',300],['Cold Beverages','Plain Lassi',150],['Cold Beverages','Special Lassi',250],['Cold Beverages','Masala Chaas',70],['Cold Beverages','Fresh Lemonade',120],['Cold Drinks','Redbull',180],['Cold Drinks','Diet Coke',90],['Cold Drinks','Coke',90],['Cold Drinks','Thums Up',90],['Cold Drinks','Sprite',90],['Cold Drinks','Fanta',90],['All Day Platters','Indori Poha',180],['All Day Platters','Aloo Paratha Platter',150],['All Day Platters','Gobhi Paratha Platter',180],['All Day Platters','Paneer Paratha Platter',250],['All Day Platters','Poori Bhaji Platter',150],['All Day Platters','Idli-Sambhar Combo',180],['All Day Platters','Veg Cheese Sandwich',250],['All Day Platters','Yoga Platter',300],['All Day Platters','Chhole Bhature',250],['All Day Platters','Unlimited Backpacker Thali',150],['All Day Platters','Special Thali',250]];
const WA='917340336308',money=n=>'₹'+Number(n).toLocaleString('en-IN');let cart={},cat='All';const $=id=>document.getElementById(id);
function renderCats(){let cs=['All',...new Set(MENU.map(x=>x[0]))];$('cats').innerHTML=cs.map(c=>`<button class="cat ${c===cat?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderCats();renderItems()})}
function renderItems(){let arr=MENU.map((x,i)=>({cat:x[0],name:x[1],price:x[2],id:i})).filter(x=>cat==='All'||x.cat===cat);$('items').innerHTML=arr.map(x=>`<button class="item" data-add="${x.id}"><small>${x.cat}</small><b>${x.name}</b><span class="price">${money(x.price)} · Add +</span></button>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let id=+b.dataset.add;cart[id]=(cart[id]||0)+1;renderCart()})}
function renderCart(){let ids=Object.keys(cart),total=0;if(!ids.length){$('cart').innerHTML='<div class="empty">Your cart is empty. Add something delicious.</div>';$('total').textContent=money(0);return}$('cart').innerHTML=ids.map(id=>{let x=MENU[+id],q=cart[id];total+=x[2]*q;return `<div class="row"><div><b>${x[1]}</b><div style="font-size:12px;color:#71808a">${money(x[2])} each</div></div><div class="qty"><button data-change="${id}" data-d="-1">−</button><b>${q}</b><button data-change="${id}" data-d="1">+</button></div></div>`}).join('');$('total').textContent=money(total);document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{let id=b.dataset.change;cart[id]+=+b.dataset.d;if(cart[id]<=0)delete cart[id];renderCart()})}
$('send').onclick=()=>{let name=$('name').value.trim(),ids=Object.keys(cart);if(!name){$('name').focus();alert('Please enter your name.');return}if(!ids.length){alert('Please add at least one item.');return}let lines=ids.map(id=>{let x=MENU[+id];return `${cart[id]} x ${x[1]} — ${money(cart[id]*x[2])}`}),total=ids.reduce((s,id)=>s+MENU[+id][2]*cart[id],0);let msg=`*VYOM — NEW QR ORDER*\nCustomer: ${name}\nOrder type: Dine-in / Takeaway (please confirm)\n\n${lines.join('\n')}\n\n*Total: ${money(total)}*\nPayment: At counter${$('notes').value.trim()?'\nNotes: '+$('notes').value.trim():''}`;window.location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg)};
renderCats();renderItems();renderCart();
</script></body></html>
